id: react_spa
name: React Single-Page Application
description: React + TypeScript SPA with Vite, component architecture, and client-side
  state management
version: 1.0.0
maturity: production
confidentiality_policy: transparent
tech_stack:
  defaults:
    language: typescript
    framework: react
    database: none
    testing: vitest
    linter: eslint
    type_checker: tsc
  overridable: true
pipeline:
  levels:
  - skeleton
  - contracts
  - wiring
  - logic
  enable_self_challenge: true
  enable_structural_validation: true
  max_self_challenge_retries: 3
structure:
  expected_dirs:
  - src/
  - src/components/
  - src/context/
  - src/hooks/
  - src/utils/
  - src/data/
  - src/types/
  expected_files:
  - package.json
  - tsconfig.json
  - vite.config.ts
  - index.html
  - src/main.tsx
  - src/App.tsx
  - README.md
infrastructure_files:
- src/components/ErrorBoundary.tsx
- src/lib/constants.ts
- src/hooks/useAsync.ts
- src/i18n/strings.ts
- src/lib/logger.ts
context_recipes:
  skeleton:
    include:
    - spec
    - archetype_structure
    max_tokens: 3000
  contracts:
    include:
    - spec
    - skeleton
    - reference_patterns
    max_tokens: 7000
  wiring:
    include:
    - contracts
    - skeleton
    max_tokens: 9000
  logic:
    include:
    - function_stub
    - function_deps
    - reference_patterns
    max_tokens: 6000
validation:
  checks:
  - syntax
  - types
  - imports
  - structure
  lint_rules: eslint:recommended
  type_strictness: strict
self_challenge:
  criteria:
  - All pages and routes match the spec
  - No hardcoded secrets or credentials
  - All referenced imports actually exist in the project
  - No invented API endpoints or library methods
  - Error handling present on all data operations
  - Data models and types match the spec requirements
  - All CRUD operations implemented as specified
  - Form validation prevents invalid data submission
  - Navigation works without full page reloads
  - Data persists correctly (localStorage, API, or as specified)
  - No orphaned references when entities are deleted
  - Business logic rules enforced (e.g. status transitions, constraints)
  - "No null! or 'as any' type assertions \u2014 use safe narrowing"
  - "No magic numbers \u2014 all constants named and extracted"
  - "No DRY violations \u2014 shared logic extracted into utils or hooks"
  - Context is split by domain if more than 3 entities (no god-context)
  - Forms are separate components, testable in isolation
  - Data layer functions are async-compatible for future API migration
  - "CSS uses custom properties or modules \u2014 no inline style objects for layout"
  - Responsive layout with at least two breakpoints
  - ErrorBoundary wraps every route-level component
  - Every interactive element has keyboard support (Enter/Space handlers)
  - Modals have aria-modal, focus trap, and Escape-to-close
  - Form inputs use htmlFor+id pairing or wrapping label pattern
  - All user-facing strings are centralized (i18n-extractable)
  - Every state mutation has a logging hook point
  - Loading and error states handled for async operations
  - Semantic HTML elements used (nav, main, section, article, header)
  - "No XSS vulnerabilities \u2014 no dangerouslySetInnerHTML"
  - Component files are under 150 lines each
  grounding_check: true
  assumptions_must_declare: true
reference_patterns:
- react_context_pattern
- react_hook_pattern
- react_form_pattern
- react_error_boundary_pattern
- vite_config_pattern
- css_custom_properties_pattern
target_output: React TypeScript single-page application with component architecture
scoring_weights:
  type_safety: 1.0
  modularity: 1.0
  maintainability: 1.0
  accessibility: 1.0
  performance: 1.0
  observability: 0.3
  testability: 1.0
  debuggability: 1.0
  feature_extensibility: 1.0
  cloud_scalability: 0.0
  api_migration_cost: 0.5
  test_surface: 1.0
  team_onboarding: 1.0
